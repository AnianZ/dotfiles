env:
  TERM: xterm-256color
window:
  dynamic_title: true

colors:
  primary:
    background: '#303030'
    foreground: '#c6c6c6'

draw_bold_text_with_bright_colors: true

font:
  normal:
    family: "BlexMono Nerd Font"
  bold:
    family: "BlexMono Nerd Font"
  italic:
    family: "BlexMono Nerd Font"
  size: 11.0

hints:
  enabled:
   - regex: "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)\
             [^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
     command: xdg-open
     post_processing: true
     mouse:
       enabled: true
       mods: Control
