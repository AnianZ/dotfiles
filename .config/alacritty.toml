[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#303030"
foreground = "#c6c6c6"

[env]
TERM = "xterm-256color"

[font]
size = 11.0

[font.bold]
family = "BlexMono Nerd Font"

[font.italic]
family = "BlexMono Nerd Font"

[font.normal]
family = "BlexMono Nerd Font"

[[hints.enabled]]
command = "xdg-open"
post_processing = true
regex = "(mailto:|gemini:|gopher:|https:|http:|news:|file:|git:|ssh:|ftp:)[^\u0000-\u001F\u007F-<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true
mods = "Control"

[window]
dynamic_title = true
